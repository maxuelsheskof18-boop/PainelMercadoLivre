<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Painel de Mensagens - Mercado Livre</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-mark">ML</span>
      <h1>Painel de Mensagens</h1>
    </div>
    <div class="topbar-actions">
      <button id="sync-btn" class="btn btn-ghost" title="Buscar novidades agora">
        <span class="btn-icon">⟳</span><span class="btn-label">Atualizar</span>
      </button>
      <div class="accounts-dropdown">
        <button id="accounts-btn" class="btn btn-ghost" title="Ver contas do Mercado Livre conectadas">
          <span class="btn-icon">👤</span><span class="btn-label">Contas</span><span id="accounts-count" class="tab-count hidden">0</span>
        </button>
        <div id="accounts-panel" class="accounts-panel hidden">
          <div class="accounts-panel-header">Contas do Mercado Livre conectadas</div>
          <div id="accounts-list" class="accounts-list">
            <p class="muted small" style="padding: 8px 14px;">Carregando...</p>
          </div>
          <a href="/connect" class="btn btn-ghost btn-sm accounts-panel-add">
            <span class="btn-icon">+</span> Conectar outra conta
          </a>
        </div>
      </div>
      <button id="freight-account-btn" class="btn btn-ghost" title="Conectar Melhor Envio pra calcular frete">
        <span class="btn-icon">📦</span><span class="btn-label" id="freight-account-label">Melhor Envio</span>
      </button>
      <button id="bell" class="bell" title="Mensagens pendentes">
        🔔<span id="bell-count" class="badge hidden">0</span>
      </button>
      <button id="logout-btn" class="btn btn-ghost btn-icon-only" title="Sair">
        <span class="btn-icon">⏻</span>
      </button>
    </div>
  </header>

  <main class="layout">
    <nav class="module-nav">
      <button class="module-nav-item active" data-module="messages">
        <span class="module-nav-icon">💬</span>
        <span class="module-nav-label">Mensagens</span>
        <span id="module-badge-messages" class="tab-count hidden">0</span>
      </button>
      <button class="module-nav-item" data-module="claims">
        <span class="module-nav-icon">⚠️</span>
        <span class="module-nav-label">Reclamações</span>
        <span id="module-badge-claims" class="tab-count hidden">0</span>
      </button>
    </nav>
    <section class="list-pane">
      <div id="tabs-messages" class="tabs">
        <button class="tab active" data-status="pending">
          Pendentes<span id="tab-count-pending" class="tab-count hidden">0</span>
        </button>
        <button class="tab" data-status="answered">Respondidas</button>
        <button class="tab" data-status="no_contact" title="Vendas de combinar entrega sem nenhuma mensagem trocada ainda">
          Sem contato<span id="tab-count-nocontact" class="tab-count hidden">0</span>
        </button>
        <button class="tab" data-status="delivered" title="Mensagens recebidas em pedidos já entregues (nota fiscal, dúvidas, etc.)">
          Entregues<span id="tab-count-delivered" class="tab-count hidden">0</span>
        </button>
      </div>
      <div id="tabs-claims" class="tabs hidden">
        <button class="tab active" data-claim-status="open">Abertas</button>
        <button class="tab" data-claim-status="closed">Fechadas</button>
      </div>
      <div class="filter-bar">
        <input
          type="search"
          id="filter-search"
          class="filter-search"
          placeholder="Buscar por comprador, produto ou nº do pedido..."
        />
        <div class="filter-row">
          <select id="filter-seller" class="filter-select" title="Filtrar por loja">
            <option value="">Todas as lojas</option>
          </select>
          <button type="button" id="filter-sort-btn" class="btn btn-ghost btn-sm" title="Alternar ordem por data">
            <span id="filter-sort-icon">⬇</span> <span id="filter-sort-label">Mais recentes</span>
          </button>
        </div>
        <label class="filter-toggle">
          <input type="checkbox" id="filter-combinar" />
          <span>Só "combinar entrega"</span>
        </label>
      </div>
      <div id="conversation-list" class="conversation-list">
        <p class="muted empty-msg">Carregando...</p>
      </div>
    </section>

    <section class="thread-pane">
      <div id="thread-empty" class="muted centered empty-state">
        <span class="empty-state-icon">💬</span>
        <p>Selecione uma conversa na lista ao lado.</p>
      </div>
      <div id="thread" class="thread hidden">
        <div class="thread-header">
          <button id="thread-back" class="btn-back" title="Voltar para a lista">←</button>
          <div id="thread-avatar" class="avatar avatar-lg"></div>
          <div class="thread-header-info">
            <strong id="thread-buyer">-</strong>
            <span id="thread-account" class="muted small"></span>
          </div>
          <span id="thread-delivery-tag" class="tag tag-delivery hidden">Combinar entrega</span>
          <span id="thread-delivered-tag" class="tag tag-delivered hidden">Pedido já entregue</span>
          <span id="thread-shipping-tag" class="tag tag-shipping hidden">-</span>
          <span id="thread-claim-stage-tag" class="tag tag-claim hidden">-</span>
        </div>
        <div id="claim-due-banner" class="claim-due-banner hidden"></div>
        <div id="thread-order-card" class="order-card hidden">
          <span class="order-card-icon">📦</span>
          <div class="order-card-info">
            <strong id="order-card-product">-</strong>
            <span id="order-card-meta" class="muted small"></span>
          </div>
          <a id="order-card-link" href="#" target="_blank" rel="noopener" class="order-card-link">Ver no Mercado Livre ↗</a>
        </div>
        <div id="claim-info-card" class="order-card hidden">
          <span class="order-card-icon">⚠️</span>
          <div class="order-card-info">
            <strong id="claim-info-title">-</strong>
            <span id="claim-info-meta" class="muted small"></span>
          </div>
        </div>
        <div id="evidence-box" class="freight-box hidden">
          <button type="button" id="evidence-toggle" class="freight-toggle">
            📮 Enviar comprovante de envio <span id="evidence-toggle-arrow">▾</span>
          </button>
          <div id="evidence-form" class="freight-form hidden">
            <div class="freight-row">
              <label>Método de envio
                <select id="evidence-method">
                  <option value="mail">Correios</option>
                  <option value="courier">Transportadora</option>
                  <option value="personal">Entrega pessoal</option>
                  <option value="email">E-mail (produto digital)</option>
                </select>
              </label>
            </div>
            <div id="evidence-fields-mail" class="freight-row evidence-fields">
              <label>Transportadora<input id="evidence-mail-company" placeholder="Correios" /></label>
              <label>Data de envio<input id="evidence-mail-date" type="date" /></label>
            </div>
            <div id="evidence-fields-courier" class="freight-row evidence-fields hidden">
              <label>Transportadora<input id="evidence-courier-company" /></label>
              <label>Agência destino<input id="evidence-courier-agency" /></label>
              <label>Data de envio<input id="evidence-courier-date" type="date" /></label>
              <label>Nome do destinatário<input id="evidence-courier-receiver" /></label>
            </div>
            <div id="evidence-fields-personal" class="freight-row evidence-fields hidden">
              <label>Data de entrega<input id="evidence-personal-date" type="date" /></label>
            </div>
            <div id="evidence-fields-email" class="freight-row evidence-fields hidden">
              <label>E-mail do destinatário<input id="evidence-email-receiver" type="email" /></label>
              <label>Data de envio<input id="evidence-email-date" type="date" /></label>
            </div>
            <button type="button" id="evidence-send-btn" class="btn btn-primary btn-sm">Enviar comprovante</button>
            <div id="evidence-results" class="freight-results"></div>
          </div>
        </div>
        <div id="freight-box" class="freight-box hidden">
          <button type="button" id="freight-toggle" class="freight-toggle">📦 Calcular frete (Melhor Envio) <span id="freight-toggle-arrow">▾</span></button>
          <div id="freight-form" class="freight-form hidden">
            <div class="freight-row">
              <label>CEP destino<input id="freight-cep" placeholder="00000-000" /></label>
              <label>Peso (kg)<input id="freight-weight" type="number" step="0.01" min="0" value="0.3" /></label>
            </div>
            <div class="freight-row">
              <label>Altura (cm)<input id="freight-height" type="number" min="1" value="4" /></label>
              <label>Largura (cm)<input id="freight-width" type="number" min="1" value="11" /></label>
              <label>Comprimento (cm)<input id="freight-length" type="number" min="1" value="16" /></label>
            </div>
            <button type="button" id="freight-calc-btn" class="btn btn-primary btn-sm">Calcular frete</button>
            <div id="freight-results" class="freight-results"></div>
          </div>
        </div>
        <div id="thread-messages" class="thread-messages"></div>
        <div id="quick-templates" class="quick-templates hidden">
          <button type="button" id="template-combinar-btn" class="btn btn-ghost btn-sm">
            📋 Msg: combinar entrega
          </button>
        </div>
        <form id="reply-form" class="reply-form">
          <input type="file" id="reply-attachment" class="hidden" accept=".jpg,.jpeg,.png,.pdf,.txt" />
          <button type="button" id="reply-attach-btn" class="btn btn-ghost btn-icon-only hidden" title="Anexar arquivo (JPG, PNG, PDF ou TXT, até 5MB)">📎</button>
          <textarea id="reply-text" placeholder="Escreva sua resposta..." required></textarea>
          <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
        <div id="reply-attachment-name" class="muted small hidden"></div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
