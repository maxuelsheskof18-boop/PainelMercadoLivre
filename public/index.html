<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Painel de Mensagens - Mercado Livre</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Painel de Mensagens</h1>
    <div class="topbar-actions">
      <button id="sync-btn" class="ghost" title="Buscar novidades agora">Atualizar</button>
      <a href="/connect" class="ghost">+ Conectar conta</a>
      <button id="bell" class="bell" title="Mensagens pendentes">
        🔔<span id="bell-count" class="badge hidden">0</span>
      </button>
      <button id="logout-btn" class="ghost">Sair</button>
    </div>
  </header>

  <main class="layout">
    <section class="list-pane">
      <div class="tabs">
        <button class="tab active" data-status="pending">Pendentes</button>
        <button class="tab" data-status="answered">Respondidas</button>
      </div>
      <div id="conversation-list" class="conversation-list">
        <p class="muted empty-msg">Carregando...</p>
      </div>
    </section>

    <section class="thread-pane">
      <div id="thread-empty" class="muted centered">
        Selecione uma conversa na lista ao lado.
      </div>
      <div id="thread" class="thread hidden">
        <div class="thread-header">
          <strong id="thread-buyer">-</strong>
          <span id="thread-account" class="muted"></span>
        </div>
        <div id="thread-messages" class="thread-messages"></div>
        <form id="reply-form" class="reply-form">
          <textarea id="reply-text" placeholder="Escreva sua resposta..." required></textarea>
          <button type="submit">Enviar resposta</button>
        </form>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
