<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Flex — mapa e rotas | Painel</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="flex.css">
</head>
<body>
  <aside id="painel">
    <header>
      <h1>Flex — mapa e rotas</h1>
      <p class="mini"><a href="/index.html">&larr; voltar ao painel</a></p>
      <p id="status" class="status">Carregando...</p>
      <div class="linha-botoes">
        <button id="btn-atualizar" class="primario"
          title="Tira o que ja saiu para entrega e traz as vendas novas">Atualizar</button>
        <button id="btn-rodar" class="discreto"
          title="Le tudo de novo, do zero — so se desconfiar que falta algo">recarregar tudo</button>
      </div>
      <p id="contas-resumo" class="mini"></p>
    </header>

    <section>
      <h2>Contas do Mercado Livre</h2>
      <div id="contas" class="zonas"></div>
      <div class="linha-botoes" style="margin-top:8px">
        <a class="botao-link secundario" href="/connect">Conectar conta</a>
        <a class="botao-link secundario" href="/api/flex/diagnostico" target="_blank" rel="noreferrer">Diagnóstico</a>
      </div>
    </section>

    <section>
      <h2>Partida</h2>
      <div class="campo">
        <input id="partida" type="text" placeholder="CEP ou endereço do CD">
        <button id="btn-partida">Definir</button>
      </div>
      <p id="partida-info" class="mini"></p>
    </section>

    <section>
      <h2>Buscar pedido</h2>
      <div class="campo">
        <input id="busca" type="text" placeholder="Pedido, cliente, rua, bairro ou telefone">
        <button id="btn-busca-limpar" title="Limpar busca">&times;</button>
      </div>
      <div id="busca-resultados"></div>
    </section>

    <section>
      <h2>Filtros</h2>
      <label class="campo-label">Valor mínimo do pedido
        <input id="valor-min" type="number" value="0" min="0" step="10">
      </label>
      <label class="campo-label">Paradas por rota
        <input id="max-paradas" type="number" value="9" min="2" max="23">
      </label>
      <label class="campo-label">Entrega
        <select id="filtro-prazo">
          <option value="">todas</option>
          <option value="hoje">hoje e atrasadas</option>
          <option value="amanha">amanha</option>
        </select>
      </label>
      <label class="campo-check"><input id="so-flex" type="checkbox" checked> Somente Flex</label>
      <label class="campo-check"><input id="sem-cancelados" type="checkbox" checked> Ignorar canceladas</label>
      <p id="resumo-filtro" class="mini"></p>
      <button id="btn-zonas" class="dobra" type="button">
        <span id="zonas-rotulo">Zonas</span><span id="zonas-seta">▸</span>
      </button>
      <div id="zonas-filtro" class="zonas" hidden></div>
    </section>

    <section>
      <h2>Rotas</h2>
      <label class="campo-check">
        <input id="juntar-zonas" type="checkbox">
        Juntar as zonas ligadas numa rota so
      </label>
      <div class="linha-botoes">
        <button id="btn-rotas" class="primario">Gerar rotas</button>
        <button id="btn-manual">Montar rota manual</button>
        <button id="btn-limpar-rotas">Limpar rotas</button>
      </div>
      <div id="rota-manual"></div>
      <div id="rotas"></div>
    </section>

    <section>
      <h2>Historico</h2>
      <div id="historico-aviso"></div>
      <div class="linha-botoes">
        <button id="btn-historico">Ver dias guardados</button>
      </div>
      <div id="historico"></div>
    </section>

    <section>
      <h2>Parada extra</h2>
      <textarea id="extra-texto" rows="3"
        placeholder="Cole aqui a venda do ERP (ou so o endereco)"></textarea>
      <div class="linha-botoes" style="margin-top:6px">
        <button id="btn-extra" class="primario">Adicionar parada</button>
      </div>
      <p id="extra-info" class="mini"></p>
      <div id="extras"></div>
    </section>

    <section>
      <h2>Exportar</h2>
      <div class="linha-botoes">
        <button id="btn-csv" title="Colunas de sempre, para o Lalamove">Baixar CSV</button>
        <button id="btn-csv-mymaps" title="Colunas que o Google My Maps entende">CSV para My Maps</button>
      </div>
      <div class="linha-botoes" style="margin-top:6px">
        <button id="btn-imprimir" title="Folha de rota para o motorista — salve como PDF">Imprimir / PDF</button>
        <button id="btn-json">Copiar JSON</button>
      </div>
    </section>

    <section id="secao-problemas">
      <h2>Pendências</h2>
      <div id="problemas"></div>
    </section>
  </aside>

  <main id="mapa-wrap">
    <div id="mapa">
      <div id="tiles"></div>
      <svg id="linhas"></svg>
      <div id="pins"></div>
    </div>
    <div id="zoom-controles">
      <button id="btn-mais">+</button>
      <button id="btn-menos">−</button>
      <button id="btn-fit" title="Enquadrar todos os pedidos">⤢</button>
    </div>
    <div id="popup" hidden></div>
    <div id="motorista" hidden></div>
    <p id="credito">© OpenStreetMap contributors</p>
  </main>

  <!-- Fora do <main> de proposito: a regra de impressao esconde
       "body > *" menos esta folha; se ela ficasse dentro do main, o pai
       sumiria junto e a impressao sairia em branco. -->
  <div id="folha" hidden></div>

  <script src="flex.js"></script>
</body>
</html>
