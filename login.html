<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Painel Mercado Livre - Entrar</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body class="login-body">
  <form id="login-form" class="login-card">
    <h1>Painel de Mensagens</h1>
    <p class="muted">Digite a senha do painel para continuar.</p>
    <input type="password" id="password" placeholder="Senha" autofocus required />
    <button type="submit">Entrar</button>
    <p id="login-error" class="error hidden">Senha incorreta.</p>
  </form>

  <script>
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("login-error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.classList.add("hidden");
      const password = document.getElementById("password").value;

      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });

      if (res.ok) {
        window.location.href = "/index.html";
      } else {
        errorEl.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
